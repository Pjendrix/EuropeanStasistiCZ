<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil poslance – EP Watch CZ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231f4fbf%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2214%22 font-family=%22sans-serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3ECZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html">EP Watch <span>CZ</span></a>
  <nav>
    <a href="index.html" data-page="meps">Poslanci</a>
    <a href="votes.html" data-page="votes">Hlasování</a>
    <a href="o-projektu.html" data-page="about">O projektu</a>
  </nav>
</div></header>

<main id="main"><p class="loading">Načítám…</p></main>

<footer class="site-footer"><div class="inner">
  Data: <a href="https://howtheyvote.eu">HowTheyVote.eu</a> (ODbL) a <a href="https://data.europarl.europa.eu">EP Open Data</a> (CC BY 4.0).
  Portréty © European Union – Source: EP. <a href="o-projektu.html">O projektu</a>.
</div></footer>

<script src="app.js"></script>
<script>
setNav("meps");
const main = document.getElementById("main");

function metricCard(label, pair, detail, sourceHref) {
  return `<div class="card metric">
    <div class="label">${label}</div>
    <div class="value">${fmtPct(pct(pair))}</div>
    <div class="detail">${pair && pair[1] ? `${fmtNum(pair[0])} z ${fmtNum(pair[1])} hlasování` : "nepočítá se"}</div>
    <div class="detail">${detail} · <a href="${sourceHref}">zdroj a metodika</a></div>
  </div>`;
}

function monthlyChart(monthly) {
  const months = Object.keys(monthly);
  if (!months.length) return '<p class="muted">Žádná hlasování v době mandátu.</p>';
  const cols = months.map((k) => {
    const v = pct(monthly[k].attendance);
    const pair = monthly[k].attendance;
    return `<div class="col" title="${fmtMonth(k)}: ${fmtPct(v)} (${pair[0]} z ${pair[1]})">
      <span class="${v === 0 ? "zero" : ""}" style="height:${v ? v * 100 : 0}%"></span></div>`;
  }).join("");
  return `<div class="chart-wrap"><div class="chart-y"><span>100 %</span><span>50 %</span><span>0 %</span></div>
    <div class="chart" role="img" aria-label="Docházka po měsících">${cols}</div></div>
    <div class="chart-axis"><span>${fmtMonth(months[0])}</span><span>${fmtMonth(months[months.length - 1])}</span></div>`;
}

function periodText(x) {
  return `${fmtDate(x.start)} – ${x.end ? fmtDate(x.end) : "dosud"}`;
}

(async () => {
  try {
    const id = param("id");
    const [mepsDoc, stats, groups, parties, index] = await Promise.all([
      getJSON("meps.json"), getJSON("stats.json"), getJSON("groups.json"), getJSON("parties.json"), getJSON("votes/index.json"),
    ]);
    const mep = mepsDoc.meps.find((m) => String(m.id) === id);
    if (!mep) throw new Error("Poslanec nenalezen. Vrať se na přehled.");
    const byId = Object.fromEntries(mepsDoc.meps.map((m) => [String(m.id), m]));
    const st = stats.meps[String(mep.id)];
    const t = st.total;
    const name = displayName(mep);
    document.title = `${name} – EP Watch CZ`;
    const active = isActive(mep);
    const g = currentOf(mep.groups);
    const p = currentOf(mep.parties);
    const htvMember = `https://howtheyvote.eu/members/${mep.id}`;

    const committeesNow = mep.committees.filter((c) => !c.end || c.end >= new Date().toISOString().slice(0, 10));
    const committeesPast = mep.committees.filter((c) => !committeesNow.includes(c));
    const committeeLi = (c) => `<li><strong>${esc(c.code)}</strong> – ${esc(c.name_cs || c.name_en || "")}
      <div class="small muted">${ROLE_LABEL[c.role] || esc(c.role)} · ${COMMITTEE_TYPE[c.type] || esc(c.type)} · ${periodText(c)}</div></li>`;

    const pairs = Object.entries(st.pairwise)
      .map(([k, v]) => ({ m: byId[k], v }))
      .filter((x) => x.m && x.v[1] >= 50)
      .sort((a, b) => pct(b.v) - pct(a.v));

    main.innerHTML = `
      <p class="small"><a href="index.html">← Všichni poslanci</a></p>
      <div class="profile-head">
        <figure class="portrait">
          ${mep.photo_url ? `<img src="${photoUrl(mep)}" alt="Portrét: ${esc(name)}">` : ""}
          ${mep.photo_credit ? `<figcaption>${esc(mep.photo_credit)}</figcaption>` : ""}
        </figure>
        <div>
          <h1>${esc(name)}</h1>
          <div class="facts">
            ${groupBadge(null, groups, g?.code)}
            ${p ? partyBadge(p.org_id, p.short_label, parties) : '<span class="badge outline">strana neuvedena</span>'}
            ${active ? '<span class="badge outline">v mandátu</span>' : '<span class="badge outline">bývalý poslanec</span>'}
          </div>
          <p class="muted">Mandát: ${mandateText(mep)}</p>
          <p class="small">
            <a href="${esc(mep.profile_url)}">Profil na webu EP</a> ·
            <a href="${htvMember}">Hlasování na HowTheyVote.eu</a> ·
            <a href="${esc(mep.source_url)}">Data z EP API</a>
          </p>
        </div>
      </div>

      <h2>Hlasování v číslech</h2>
      <div class="metrics">
        ${metricCard("Docházka", t.attendance, "všechna jmenovitá hlasování v době mandátu", "o-projektu.html#metodika")}
        ${metricCard("Docházka – hlavní hlasování", t.attendance_main, "závěrečná hlasování o celém textu", "o-projektu.html#metodika")}
        ${metricCard("Loajalita k frakci", t.group_loyalty, "jen informativní", "o-projektu.html#metodika")}
        ${metricCard("Shoda s ostatními Čechy", t.cz_agreement, "jen informativní", "o-projektu.html#metodika")}
      </div>
      <p class="source">Hlasoval/a pro ${fmtNum(t.positions.FOR)}×, proti ${fmtNum(t.positions.AGAINST)}×,
        zdržel/a se ${fmtNum(t.positions.ABSTENTION)}×, nehlasoval/a ${fmtNum(t.positions.DID_NOT_VOTE)}×. ${sourceLine(stats)}</p>

      <h2>Docházka po měsících</h2>
      <div class="card">${monthlyChart(st.monthly)}
        <p class="small muted">Sloupec = podíl hlasování v měsíci, ve kterých hlasoval/a. Červená čárka = v měsíci nehlasoval/a ani jednou.
        Najetím myší se ukáže přesné číslo. Měsíce bez zasedání (srpen) chybí.</p></div>

      <div class="grid-2">
        <section>
          <h2>Frakce a strana</h2>
          <div class="card"><ul class="plain">
            ${mep.groups.map((x) => `<li>${groupBadge(null, groups, x.code)} ${esc(x.name_cs || x.name_en || "")}
              <div class="small muted">${periodText(x)}</div></li>`).join("")}
            ${mep.parties.map((x) => `<li>${partyBadge(x.org_id, x.short_label, parties)} ${esc(x.name || "")}
              <div class="small muted">${periodText(x)}</div></li>`).join("") || '<li class="muted">Česká strana není v EP datech uvedena.</li>'}
          </ul>
          <p class="source">Zdroj: <a href="${esc(mep.source_url)}">EP Open Data</a></p></div>
        </section>
        <section>
          <h2>Výbory</h2>
          <div class="card">
            <ul class="plain">${committeesNow.map(committeeLi).join("") || '<li class="muted">Žádný aktuální výbor.</li>'}</ul>
            ${committeesPast.length ? `<h3>Dříve</h3><ul class="plain">${committeesPast.map(committeeLi).join("")}</ul>` : ""}
            <p class="source">Zdroj: <a href="${esc(mep.source_url)}">EP Open Data</a></p>
          </div>
        </section>
      </div>

      <h2>S kým hlasuje stejně</h2>
      <div class="card">
        <p class="small muted">Podíl hlasování, kde oba hlasovali a hlasovali stejně (jen dvojice s aspoň 50 společnými hlasováními).</p>
        <ul class="plain">${pairs.map(({ m, v }) => `<li style="display:flex;justify-content:space-between;gap:1rem;align-items:center">
            <span><a href="mep.html?id=${m.id}">${esc(displayName(m))}</a> ${groupBadge(null, groups, currentOf(m.groups)?.code)}</span>
            <span class="num">${fmtPct(pct(v))} <span class="small muted">(${fmtNum(v[0])} z ${fmtNum(v[1])})</span></span></li>`).join("")
          || '<li class="muted">Nedostatek společných hlasování.</li>'}</ul>
      </div>

      <h2>Poslední hlavní hlasování</h2>
      <div id="recent" class="loading">Načítám…</div>
    `;

    // Poslední hlasování: projde měsíce od nejnovějšího, dokud nenajde hlasování v době mandátu.
    const recent = document.getElementById("recent");
    const rows = [];
    for (const { month } of index.months.slice().reverse()) {
      const data = await getJSON(`votes/${month}.json`);
      for (const v of data.votes.slice().reverse()) {
        const pos = v.cz_positions.find((x) => x.member_id === mep.id);
        const inMandate = mep.mandates.some((m) => m.start <= v.date && (!m.end || v.date <= m.end));
        if (pos && inMandate && v.is_main) rows.push({ v, pos, month });
        if (rows.length >= 15) break;
      }
      if (rows.length >= 15) break;
    }
    recent.className = "";
    recent.innerHTML = rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Datum</th><th>Hlasování</th><th>Volba</th><th>Výsledek</th></tr></thead>
      <tbody>${rows.map(({ v, pos, month }) => `<tr>
        <td class="num">${fmtDate(v.date)}</td>
        <td><a class="vote-title" href="vote.html?id=${v.id}&m=${month}">${esc(voteTitle(v))}</a>
          <div class="small muted">${esc(voteSubtitle(v))}</div></td>
        <td class="pos pos-${pos.position}">${POSITION_LABEL[pos.position]}</td>
        <td class="result-${v.result || ""}">${RESULT_LABEL[v.result] || "–"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="source">Zdroj: <a href="https://howtheyvote.eu/members/${mep.id}">HowTheyVote.eu</a>.
      Všechna hlasování najdeš v <a href="votes.html">seznamu hlasování</a>.</p>`
      : '<p class="muted">Žádná hlasování.</p>';
  } catch (e) {
    showError(main, e);
  }
})();
</script>
</body>
</html>
