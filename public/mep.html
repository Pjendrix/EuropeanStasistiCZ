<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil poslance – EP Watch CZ</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%231f4fbf%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2214%22 font-family=%22sans-serif%22 font-weight=%22700%22 text-anchor=%22middle%22 fill=%22white%22%3ECZ%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html">EP Watch <span>CZ</span></a>
  <nav>
    <a href="index.html" data-page="meps">Poslanci</a>
    <a href="party.html" data-page="parties">Strany</a>
    <a href="votes.html" data-page="votes">Hlasování</a>
    <a href="rozkol.html" data-page="splits">Kde se Češi rozdělili</a>
    <a href="rozhodujici.html" data-page="decisive">Rozhodující hlasování</a>
    <a href="o-projektu.html" data-page="about">O projektu</a>
  </nav>
</div></header>

<main id="main"><p class="loading">Načítám…</p></main>

<footer class="site-footer"><div class="inner">
  Data: <a href="https://howtheyvote.eu">HowTheyVote.eu</a> (ODbL) a <a href="https://data.europarl.europa.eu">EP Open Data</a> (CC BY 4.0).
  Portréty © European Union – Source: EP. <a href="o-projektu.html">O projektu</a>.
</div></footer>

<script src="app.js"></script>
<script>
setNav("meps");
const main = document.getElementById("main");

function metricCard(label, pair, detail, sourceHref) {
  return `<div class="card metric">
    <div class="label">${label}</div>
    <div class="value">${fmtPct(pct(pair))}</div>
    <div class="detail">${pair && pair[1] ? `${fmtNum(pair[0])} z ${fmtNum(pair[1])} hlasování` : "nepočítá se"}</div>
    <div class="detail">${detail} · <a href="${sourceHref}">zdroj a metodika</a></div>
  </div>`;
}

function monthlyChart(monthly) {
  const months = Object.keys(monthly);
  if (!months.length) return '<p class="muted">Žádná hlasování v době mandátu.</p>';
  const cols = months.map((k) => {
    const v = pct(monthly[k].attendance);
    const pair = monthly[k].attendance;
    return `<div class="col" title="${fmtMonth(k)}: ${fmtPct(v)} (${pair[0]} z ${pair[1]})">
      <span class="${v === 0 ? "zero" : ""}" style="height:${v ? v * 100 : 0}%"></span></div>`;
  }).join("");
  return `<div class="chart-wrap"><div class="chart-y"><span>100 %</span><span>50 %</span><span>0 %</span></div>
    <div class="chart" role="img" aria-label="Docházka po měsících">${cols}</div></div>
    <div class="chart-axis"><span>${fmtMonth(months[0])}</span><span>${fmtMonth(months[months.length - 1])}</span></div>`;
}

// Karta souladu s výsledkem: poslanec vedle průměru jeho frakce ve stejných hlasováních.
function outcomeCard(label, own, group, detail) {
  return `<div class="card metric">
    <div class="label">${label}</div>
    <div class="value">${fmtPct(pct(own))}</div>
    <div class="detail">${own && own[1] ? `${fmtNum(own[0])} z ${fmtNum(own[1])} hlasů pro/proti` : "nepočítá se"}</div>
    <div class="detail">${group && group[1] ? `průměr jeho frakce ve stejných hlasováních: <strong>${fmtPct(pct(group))}</strong>` : "průměr frakce se nepočítá (nezařazení)"}</div>
    <div class="detail">${detail} · <a href="o-projektu.html#metodika">co to znamená</a></div>
  </div>`;
}

function voteTable(rows, extraHead, extraCell) {
  if (!rows.length) return '<p class="muted">Žádné takové hlasování.</p>';
  return `<div class="table-wrap"><table>
    <thead><tr><th class="num">Datum</th><th>Hlasování</th>${extraHead}<th>Výsledek</th></tr></thead>
    <tbody>${rows.map((v) => voteRow(v, extraCell(v))).join("")}</tbody></table></div>`;
}

const OWN_STATUS = {
  ADOPTED: ["přijato", "result-ADOPTED"], REJECTED: ["zamítnuto", "result-REJECTED"],
  LAPSED: ["propadlo", ""], WITHDRAWN: ["staženo", ""],
  superseded: ["nahrazeno společným návrhem", "muted"], no_vote: ["bez jmenovitého hlasování v plénu", "muted"],
  answered: ["odpověď přišla", ""], unanswered: ["zatím bez odpovědi", "muted"],
};
const OWN_ROLE = {
  RAPPORTEUR: "zpravodaj/ka", RAPPORTEUR_CO: "spoluzpravodaj/ka", RAPPORTEUR_SHADOW: "stínový zpravodaj/ka",
  RAPPORTEUR_OPINION: "zpravodaj/ka stanoviska", RAPPORTEUR_SHADOW_OPINION: "stínový zpravodaj/ka stanoviska", AUTHOR: "autor/ka",
};
const NO_VOTE_NOTE = "HowTheyVote eviduje jen jmenovitá hlasování. O textu se mohlo hlasovat jinak (zvednutím ruky, tajně, např. u jmenování) nebo hlasování teprve proběhne.";
const QUESTION_KIND = { question_written: "písemná", question_priority: "přednostní písemná", question_oral: "ústní" };

// Souhrn po typech: výsledek jen tam, kde je známý (hlasováno v plénu), nikdy dohromady.
function ownSummaryLine(typ, s) {
  if (!s || !s.count) return "";
  let detail = "";
  if (typ === "question") detail = `odpověď přišla na ${s.answered}`;
  else if (s.voted !== undefined) {
    const parts = [`hlasováno v plénu ${s.voted}, z toho přijato ${s.adopted}`];
    if (s.superseded) parts.push(`nahrazeno společným návrhem ${s.superseded}`);
    if (s.other) parts.push(`propadlo nebo staženo ${s.other}`);
    if (s.no_vote) parts.push(`bez jmenovitého hlasování ${s.no_vote}`);
    detail = parts.join(" · ");
  } else detail = "výsledek se nesleduje";
  return `<div class="card metric"><div class="label">${esc(typ)}</div><div class="value">${fmtNum(s.count)}</div><div class="detail">${detail}</div></div>`;
}

function ownItem(e) {
  const [label, cls] = OWN_STATUS[e.status] || ["", ""];
  const title = (e.title && (e.title.cs || e.title.en)) || e.label || e.id;
  const voteLink = e.vote_id ? ` · <a href="vote.html?id=${e.vote_id}">hlasování</a>` : "";
  const extra = e.type === "question" ? `${QUESTION_KIND[e.subtype] || ""} otázka${e.authors_total > 1 ? `, spoluautorů ${e.authors_total}` : ""}${e.answer_date ? `, odpověď ${fmtDate(e.answer_date)}` : ""}`
    : e.signatories_total ? `podepsalo ${e.signatories_total} poslanců` : (e.committee ? `výbor ${esc(e.committee)}` : "");
  return `<li><a href="${esc(e.url)}">${esc(title)}</a>
    <div class="small muted">${fmtDate(e.date)} · ${esc(e.label || "")} · ${OWN_ROLE[e.role] || esc(e.role)}${extra ? ` · ${extra}` : ""}${e.report ? ` · zpráva ${esc(e.report)}` : ""}</div>
    ${label ? `<div class="small"><span class="${cls}" title="${e.status === "no_vote" ? esc(NO_VOTE_NOTE) : ""}">${label}</span>${e.joint_result ? ` (společný návrh: ${RESULT_LABEL[e.joint_result] || e.joint_result})` : ""}${voteLink}</div>` : ""}</li>`;
}

function ownWork(ow) {
  if (!ow) return '<p class="muted">Data o vlastní práci se připravují.</p>';
  const types = Object.keys(ow.type_labels);
  const cards = types.map((t) => ownSummaryLine(ow.type_labels[t], ow.summary[t])).join("");
  const lists = types.map((t) => {
    const items = ow.items.filter((e) => e.type === t);
    if (!items.length) return "";
    return `<details class="card own-list"><summary><strong>${esc(ow.type_labels[t])}</strong> (${items.length})</summary>
      <ul class="plain">${items.map(ownItem).join("")}</ul></details>`;
  }).join("");
  return `${cards ? `<div class="metrics">${cards}</div>` : '<p class="muted">V datech EP není žádná zpráva, usnesení ani otázka.</p>'}
    ${lists}
    <p class="source">Zdroj: <a href="https://data.europarl.europa.eu">EP Open Data</a> (CC BY 4.0), výsledky hlasování
      <a href="https://howtheyvote.eu">HowTheyVote.eu</a>. Aktualizováno ${fmtDate(ow.updated)}${ow.complete ? "" : " (stahování ještě neskončilo, data nejsou úplná)"}.
      Pozměňovací návrhy nejsou zahrnuté. „Bez jmenovitého hlasování“: ${esc(NO_VOTE_NOTE)} <a href="o-projektu.html#metodika">Jak počítáme</a>.</p>`;
}

function periodText(x) {
  return `${fmtDate(x.start)} – ${x.end ? fmtDate(x.end) : "dosud"}`;
}

(async () => {
  try {
    const id = param("id");
    if (!/^\d+$/.test(id || "")) throw new Error("Poslanec nenalezen. Vrať se na přehled.");
    const [profile, groups, parties] = await Promise.all([
      getJSON(`meps/${id}.json`).catch(() => { throw new Error("Poslanec nenalezen. Vrať se na přehled."); }),
      getJSON("groups.json"), getJSON("parties.json"),
    ]);
    const mep = profile.mep;
    const stats = { sources: profile.sources };
    const t = profile.total;
    const name = displayName(mep);
    document.title = `${name} – EP Watch CZ`;
    const active = isActive(mep);
    const g = currentOf(mep.groups);
    const p = currentOf(mep.parties);
    const htvMember = `https://howtheyvote.eu/members/${mep.id}`;

    const committeesNow = mep.committees.filter((c) => !c.end || c.end >= new Date().toISOString().slice(0, 10));
    const committeesPast = mep.committees.filter((c) => !committeesNow.includes(c));
    const committeeLi = (c) => `<li><strong>${esc(c.code)}</strong> – ${esc(c.name_cs || c.name_en || "")}
      <div class="small muted">${ROLE_LABEL[c.role] || esc(c.role)} · ${COMMITTEE_TYPE[c.type] || esc(c.type)} · ${periodText(c)}</div></li>`;

    const pairs = profile.pairwise
      .filter((x) => x.total >= 50)
      .map((x) => ({ m: x, v: [x.same, x.total] }));

    main.innerHTML = `
      <p class="small"><a href="index.html">← Všichni poslanci</a></p>
      <div class="profile-head">
        <figure class="portrait">
          ${mep.photo_url ? `<img src="${photoUrl(mep)}" alt="Portrét: ${esc(name)}">` : ""}
          ${mep.photo_credit ? `<figcaption>${esc(mep.photo_credit)}</figcaption>` : ""}
        </figure>
        <div>
          <h1>${esc(name)}</h1>
          <div class="facts">
            ${groupBadge(null, groups, g?.code)}
            ${p ? partyLink(p.org_id, p.short_label, parties) : `<span class="badge outline" title="${esc(NO_PARTY_NOTE)}">strana neuvedena</span>`}
            ${active ? '<span class="badge outline">v mandátu</span>' : `<span class="badge outline">${byGender(mep, "bývalý poslanec", "bývalá poslankyně")}</span>`}
          </div>
          <p class="muted">Mandát: ${mandateText(mep)}</p>
          <p class="small">
            <a href="${esc(mep.profile_url)}">Profil na webu EP</a> ·
            <a href="${htvMember}">Hlasování na HowTheyVote.eu</a> ·
            <a href="${esc(mep.source_url)}">Data z EP API</a>
          </p>
        </div>
      </div>

      <h2>Hlasování v číslech</h2>
      <div class="metrics">
        ${metricCard("Docházka", t.attendance, "všechna jmenovitá hlasování v době mandátu", "o-projektu.html#metodika")}
        ${metricCard("Docházka – hlavní hlasování", t.attendance_main, "závěrečná hlasování o celém textu", "o-projektu.html#metodika")}
        ${metricCard("Loajalita k frakci", t.group_loyalty, "jen informativní", "o-projektu.html#metodika")}
        ${metricCard("Shoda s ostatními Čechy", t.cz_agreement, "jen informativní", "o-projektu.html#metodika")}
      </div>
      <p class="source">${byGender(mep, "Hlasoval", "Hlasovala")} pro ${fmtNum(t.positions.FOR)}×, proti ${fmtNum(t.positions.AGAINST)}×,
        ${positionFor("ABSTENTION", mep)} ${fmtNum(t.positions.ABSTENTION)}×, ${positionFor("DID_NOT_VOTE", mep)} ${fmtNum(t.positions.DID_NOT_VOTE)}×. ${sourceLine(stats)}</p>

      <h2>Vlastní práce</h2>
      <p class="small muted">Zprávy, stínové zprávy, stanoviska, návrhy usnesení a otázky, na kterých se ${byGender(mep, "podílel", "podílela")}.
        U zpráv a usnesení výsledek hlavního jmenovitého hlasování v plénu, vždy po typech zvlášť.</p>
      ${ownWork(profile.own_work)}

      <h2>Soulad s výsledkem hlasování</h2>
      <p class="small muted">Jak často hlasoval${byGender(mep, "", "a")} tak, jak hlasování nakonec dopadlo. Číslo hlavně odráží velikost a pozici frakce;
        hlasovat proti většině je legitimní opoziční role. Proto ho vždy srovnáváme s průměrem frakce.</p>
      <div class="metrics">
        ${outcomeCard("Všechna hlasování", t.outcome, t.group_outcome, "jen informativní")}
        ${outcomeCard("Hlavní hlasování", t.outcome_main, t.group_outcome_main, "jen informativní")}
        ${metricCard("Těsná hlasování", t.outcome_close, "rozdíl pro − proti nejvýš 21 hlasů", "o-projektu.html#metodika")}
      </div>

      <h2>Docházka po měsících</h2>
      <div class="card">${monthlyChart(profile.monthly)}
        <p class="small muted">Sloupec = podíl hlasování v měsíci, ve kterých ${byGender(mep, "hlasoval", "hlasovala")}. Červená čárka = v měsíci ${positionFor("DID_NOT_VOTE", mep)} ani jednou.
        Najetím myší se ukáže přesné číslo. Měsíce bez zasedání (srpen) chybí.</p></div>

      <div class="grid-2">
        <section>
          <h2>Frakce a strana</h2>
          <div class="card"><ul class="plain">
            ${mep.groups.map((x) => `<li>${groupBadge(null, groups, x.code)} ${esc(x.name_cs || x.name_en || "")}
              <div class="small muted">${periodText(x)}</div></li>`).join("")}
            ${mep.parties.map((x) => `<li>${partyBadge(x.org_id, x.short_label, parties)} ${esc(x.name || "")}
              <div class="small muted">${periodText(x)}</div></li>`).join("") || `<li class="muted">${esc(NO_PARTY_NOTE)}</li>`}
          </ul>
          <p class="source">Zdroj: <a href="${esc(mep.source_url)}">EP Open Data</a></p></div>
        </section>
        <section>
          <h2>Výbory</h2>
          <div class="card">
            <ul class="plain">${committeesNow.map(committeeLi).join("") || '<li class="muted">Žádný aktuální výbor.</li>'}</ul>
            ${committeesPast.length ? `<h3>Dříve</h3><ul class="plain">${committeesPast.map(committeeLi).join("")}</ul>` : ""}
            <p class="source">Zdroj: <a href="${esc(mep.source_url)}">EP Open Data</a></p>
          </div>
        </section>
      </div>

      <h2>Hlasování proti většině frakce</h2>
      <div class="card">
        <p>${byGender(mep, "Hlasoval", "Hlasovala")} jinak než většina své frakce ${fmtNum(profile.against_group.count)}× ze
          ${fmtNum(t.group_loyalty[1])} hlasování, ve kterých se to počítá (z toho v hlavních hlasováních ${fmtNum(profile.against_group.count_main)}×).
          ${t.group_loyalty[1] ? "" : "U nezařazených poslanců se nepočítá."}</p>
        ${profile.against_group.count ? `<div class="controls"><label><input type="checkbox" id="against-main"> jen hlavní hlasování</label></div>
          <div id="against"></div>` : ""}
      </div>

      <h2>Rozhodující hlasování</h2>
      <div class="card">
        <p class="small muted">Hlasování, která by bez hlasů českých poslanců dopadla opačně (<a href="rozhodujici.html">všechna rozhodující hlasování</a>).
          Ukazuje se, jak ${byGender(mep, "hlasoval", "hlasovala")} v těch, která proběhla v době ${byGender(mep, "jeho", "jejího")} mandátu.</p>
        ${voteTable(profile.decisive, "<th>Volba</th>", (v) => `<td class="pos pos-${v.position}">${positionFor(v.position, mep)}</td>`)}
      </div>

      <h2>Podle témat</h2>
      <div class="card">
        <p class="small muted">Deset témat s nejvíce hlasováními podle Legislativní observatoře EP. Názvy témat jsou zatím v angličtině, tak jak je uvádí zdroj.</p>
        <div class="table-wrap"><table>
          <thead><tr><th>Téma</th><th class="num">Hlasování</th><th class="num">Docházka</th><th class="num">Pro / proti / zdržel${byGender(mep, "", "a")} se</th><th class="num">Loajalita k frakci</th></tr></thead>
          <tbody>${profile.topics.map((x) => `<tr>
            <td>${esc(x.label || `téma ${x.code} (zdroj neuvádí název)`)} <span class="small muted">${esc(x.code)}</span></td>
            <td class="num">${fmtNum(x.attendance[1])}</td>
            <td class="num">${pctCell(x.attendance)}</td>
            <td class="num">${fmtNum(x.positions.FOR)} / ${fmtNum(x.positions.AGAINST)} / ${fmtNum(x.positions.ABSTENTION)}</td>
            <td class="num">${pctCell(x.group_loyalty)}</td></tr>`).join("")}</tbody>
        </table></div>
      </div>

      <h2>S kým hlasuje stejně</h2>
      <div class="card">
        <p class="small muted">Podíl hlasování, kde oba hlasovali a hlasovali stejně (jen dvojice s aspoň 50 společnými hlasováními).</p>
        <ul class="plain">${pairs.map(({ m, v }) => `<li style="display:flex;justify-content:space-between;gap:1rem;align-items:center">
            <span><a href="mep.html?id=${m.id}">${esc(displayName(m))}</a> ${groupBadge(null, groups, m.group?.code)}</span>
            <span class="num">${fmtPct(pct(v))} <span class="small muted">(${fmtNum(v[0])} z ${fmtNum(v[1])})</span></span></li>`).join("")
          || '<li class="muted">Nedostatek společných hlasování.</li>'}</ul>
      </div>

      <h2>Poslední hlavní hlasování</h2>
      <div id="recent" class="loading">Načítám…</div>
    `;

    const renderAgainst = () => {
      const el = document.getElementById("against");
      if (!el) return;
      const onlyMain = document.getElementById("against-main").checked;
      el.innerHTML = voteTable(onlyMain ? profile.against_group.recent_main : profile.against_group.recent,
        "<th>Volba / frakce</th>",
        (v) => `<td><span class="pos pos-${v.position}">${positionFor(v.position, mep)}</span>
          <div class="small muted">většina ${esc(v.group_code)}: ${POSITION_LABEL[v.group_majority]}</div></td>`) +
        '<p class="small muted">Posledních 10 hlasování.</p>';
    };
    document.getElementById("against-main")?.addEventListener("change", renderAgainst);
    renderAgainst();

    const recent = document.getElementById("recent");
    const rows = profile.recent_main_votes.map((v) => ({ v, pos: v, month: v.month }));
    recent.className = "";
    recent.innerHTML = rows.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Datum</th><th>Hlasování</th><th>Volba</th><th>Výsledek</th></tr></thead>
      <tbody>${rows.map(({ v, pos, month }) => `<tr>
        <td class="num">${fmtDate(v.date)}</td>
        <td><a class="vote-title" href="vote.html?id=${v.id}&m=${month}">${esc(voteTitle(v))}</a>
          <div class="small muted">${esc(voteSubtitle(v))}</div></td>
        <td class="pos pos-${pos.position}">${positionFor(pos.position, mep)}</td>
        <td class="result-${v.result || ""}" title="${esc(RESULT_NOTE[v.result ?? null] || "")}">${RESULT_LABEL[v.result] || "neuveden"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="source">Zdroj: <a href="https://howtheyvote.eu/members/${mep.id}">HowTheyVote.eu</a>.
      Všechna hlasování najdeš v <a href="votes.html">seznamu hlasování</a>.</p>`
      : '<p class="muted">Žádná hlasování.</p>';
  } catch (e) {
    showError(main, e);
  }
})();
</script>
</body>
</html>
