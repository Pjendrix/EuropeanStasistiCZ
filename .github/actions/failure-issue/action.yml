# Issue při selhání automatického běhu (naplánovaného nebo spuštěného jiným workflow). Notifikace přijde do aplikace
# GitHub. Když už otevřené issue pro stejný workflow existuje, jen se do něj přidá komentář (žádné duplicity).
name: Issue při selhání
description: Založí nebo doplní issue „Selhal automatický běh“ s odkazem na běh.
runs:
  using: composite
  steps:
    - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
      with:
        script: |
          const title = `Selhal automatický běh: ${context.workflow}`;
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `Běh ${run} (${context.eventName}, ${new Date().toISOString().slice(0, 10)}) skončil chybou. ` +
            `Data na webu zůstala z posledního úspěšného běhu. Podrobnosti jsou v logu běhu.`;
          const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", creator: "github-actions[bot]" });
          const hit = open.find((i) => i.title === title && !i.pull_request);
          if (hit) await github.rest.issues.createComment({ ...context.repo, issue_number: hit.number, body });
          else await github.rest.issues.create({ ...context.repo, title, body });
