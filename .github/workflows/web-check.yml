# Kontrola webu v prohlížeči: žádná chyba v konzoli, nic nepřetéká při 320–1366 px, axe-core bez porušení (WCAG 2 A/AA).
# Běží jen u pull requestů, které mění web (po merge do main se neopakuje – stejný kód už prošel v PR;
# týdenní aktualizace dat ji spouští sama před commitem). Úspora minut GitHub Actions.
name: Kontrola webu

on:
  pull_request:
    paths: ["public/**", "scripts/**", "tests/e2e/**", ".github/workflows/web-check.yml"]
  workflow_dispatch: {}

# Nový push do stejného PR zruší rozběhnutou starší kontrolu.
concurrency:
  group: web-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # instalace Playwrightu občas trvá i 10 min, kontrola webu ~10 min
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Hlavička a patička (pytest běží v tests.yml)
        run: |
          pip install --require-hashes -r requirements.txt
          python scripts/layout.py --check

      - name: Stránky a hlasování po jednom (jako při sestavení na Vercelu, scripts/vercel_build.sh)
        run: |
          python scripts/build_shards.py
          python scripts/build_pages.py

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      # Prohlížeč a npm balíčky z cache (klíč = verze); bez cache trvala instalace až 10 min.
      - name: Cache Playwrightu
        id: pwcache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ${{ runner.temp }}/e2e
          key: pw-1.63.0-axe-4.13.0-${{ runner.os }}

      - name: Playwright a axe-core (jen pro tuto kontrolu, nic se nepřidává do repa)
        timeout-minutes: 15
        run: |
          if [ "${{ steps.pwcache.outputs.cache-hit }}" = "true" ]; then
            cd "$RUNNER_TEMP/e2e" && npx playwright install-deps chromium
          else
            mkdir -p "$RUNNER_TEMP/e2e" && cd "$RUNNER_TEMP/e2e"
            npm init -y >/dev/null
            npm install playwright@1.63.0 axe-core@4.13.0
            npx playwright install --with-deps chromium
          fi

      - name: Kontrola webu
        timeout-minutes: 25
        run: NODE_PATH="$RUNNER_TEMP/e2e/node_modules" node tests/e2e/check-web.mjs
