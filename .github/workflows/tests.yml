# Testy a lint u každého pull requestu a pushe do main (u PR jen jednou, kontrola webu pytest nespouští).
name: Testy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: python -m pytest -q
      - name: Lint a formát Pythonu (ruff, pravidla v ruff.toml)
        run: |
          pipx run ruff==0.13.0 check scripts tests
          pipx run ruff==0.13.0 format --check scripts tests
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: Lint JS (ESLint, pravidla v eslint.config.mjs)
        run: |
          npm install --no-save --no-package-lock eslint@9.36.0 @eslint/js@9.36.0
          npx eslint public tests/e2e/*.mjs tests/js/*.mjs eslint.config.mjs
      - name: Testy JS (node --test, čisté funkce z public/lib)
        run: node --test tests/js/*.test.mjs
