# Vlastní práce poslanců (zprávy, stínové zprávy, usnesení, otázky) z EP Open Data API.
# EP API neumí filtrovat podle poslance a odpovídá pomalu, proto se stahuje po částech:
# každý běh pracuje nejvýš ~5 hodin, uloží stav (data/proposals_state.json) a commitne;
# další běh naváže. Po dokončení prvního stažení stahuje jen nové položky (minuty).
# Kontrola nového exportu HowTheyVote (job release, ~1 min) běží denně; když vyšel, spustí týdenní aktualizaci hned
# (pondělní běh zůstává jako pojistka). Stahování vlastní práce, pozměňovacích návrhů a programu příštího zasedání
# (job proposals, ~12 min) jen v úterý a v pátek – kvůli limitu minut GitHub Actions; ruční spuštění ho pustí vždy.
name: Vlastní práce poslanců

on:
  schedule:
    # 2:17 UTC; úterý a pátek zvlášť, aby job proposals poznal svůj cron (github.event.schedule)
    - cron: "17 2 * * 0,1,3,4,6"
    - cron: "17 2 * * 2,5"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # spuštění týdenní aktualizace při novém exportu HowTheyVote
  issues: write    # issue při selhání naplánovaného běhu

concurrency:
  group: weekly-data  # stejná skupina jako týdenní aktualizace: commity do main se nepřekrývají
  cancel-in-progress: false

jobs:
  release:
    # Krátký samostatný job: neběží 5 hodin s fetch_proposals, takže týdenní aktualizace se spustí hned ráno
    # (počká jen na skupinu weekly-data, když zrovna commitují vlastní práce).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install --require-hashes -r requirements.txt

      - name: Nový export HowTheyVote?
        id: htv
        run: python scripts/fetch_votes.py --check-release >> "$GITHUB_OUTPUT"

      - name: Spustit týdenní aktualizaci
        # v pondělí ne: týdenní aktualizace běží v 4:23 UTC sama
        if: steps.htv.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ]; then echo "Pondělí: týdenní aktualizace poběží podle plánu."; exit 0; fi
          gh workflow run weekly.yml --ref main

      - name: Issue při selhání
        if: failure() && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')
        uses: ./.github/actions/failure-issue

  proposals:
    if: github.event_name != 'schedule' || github.event.schedule == '17 2 * * 2,5'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install --require-hashes -r requirements.txt

      - name: Záloha předchozího stavu
        run: cp -r data "$RUNNER_TEMP/data-prev"

      - name: Stažení (nejvýš 240 minut, pak pokračuje příští běh)
        run: python scripts/fetch_proposals.py --max-minutes 240

      - name: Pozměňovací návrhy (EP Open Data API + DOCX z registru EP)
        # Ve výborech z DOCX registru EP (jen značky šablony, CLAUDE.md), v plénu ke zprávám A10. Běžně minuty, první běh déle
        # (nedokončené dožene příští běh). Výpadek EP API jen varuje a zůstane předchozí stav; změna šablony (kód 2) běh zastaví.
        run: |
          rc=0; timeout 50m python scripts/fetch_amendments.py --max-minutes 45 || rc=$?
          if [ "$rc" -eq 2 ]; then exit 2; fi
          if [ "$rc" -ne 0 ]; then echo "::warning::fetch_amendments: EP API neodpovídá, zůstává předchozí stav"; fi

      - name: Program příštího zasedání (EP Open Data API)
        # Program je doplněk: při výpadku API zůstane předchozí soubor a vlastní práce se commitnou. Selhání ale musí být vidět
        # (23. 10. 2026 tiše spadl na 404 a web ukazoval skončené zasedání jako další): varování v souhrnu běhu.
        run: |
          rc=0; python scripts/fetch_agenda.py || rc=$?
          if [ "$rc" -ne 0 ]; then echo "::warning title=Program zasedání::fetch_agenda.py skončil kódem $rc, zůstává předchozí agenda.json"; fi

      - name: Statistiky a soubory pro web
        run: |
          python scripts/compute_stats.py
          python scripts/build_web.py
          python scripts/build_pages.py

      - name: Kontrola rozumnosti dat
        run: python scripts/check_data.py --prev "$RUNNER_TEMP/data-prev"

      - name: Commit
        # Odloží stažené soubory, srovná se s aktuálním main, přepočítá odvozené a commitne.
        run: |
          scripts/commit_data.sh "data: vlastní práce poslanců $(date -u +%Y-%m-%d)" \
            data/proposals.json data/proposals_state.json data/agenda.json data/amendments.json data/amendments_state.json

      - name: Issue při selhání
        if: failure() && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')
        uses: ./.github/actions/failure-issue
