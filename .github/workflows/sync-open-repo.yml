# Synchronizace veřejné části (výpočty a testy) do veřejného repozitáře. Postup zřízení: docs/OPEN_REPO.md.
# Potřebuje tajný klíč OPEN_REPO_TOKEN (fine-grained token s právem Contents: Read and write jen pro veřejný repozitář)
# a volitelně proměnnou OPEN_REPO (výchozí Pjendrix/ep-watch-cz-open). Do veřejného repa se posílá jen výstup export_open_repo.py,
# historie soukromého repozitáře se nezveřejňuje.
name: Synchronizace veřejného repa

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "data/manual/**"
      - "docs/open-repo/**"
      - "DATA_LICENSE.md"
      - ".github/workflows/sync-open-repo.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-open-repo
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPEN_REPO: ${{ vars.OPEN_REPO || 'Pjendrix/ep-watch-cz-open' }}
      TOKEN: ${{ secrets.OPEN_REPO_TOKEN }}
    steps:
      - name: Kontrola nastavení
        run: |
          if [ -z "$TOKEN" ]; then echo "Chybí tajný klíč OPEN_REPO_TOKEN (viz docs/OPEN_REPO.md), synchronizace se přeskočí."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Testy exportu
        run: python -m pytest -q tests/test_export_open_repo.py
      - name: Klon veřejného repa
        run: git clone "https://x-access-token:${TOKEN}@github.com/${OPEN_REPO}.git" "$RUNNER_TEMP/open"
      - name: Export
        run: python scripts/export_open_repo.py --out "$RUNNER_TEMP/open"
      - name: Commit a push
        working-directory: ${{ runner.temp }}/open
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Beze změn."; exit 0; fi
          git commit -q -m "Synchronizace z hlavního repa (${GITHUB_SHA::7})"
          git push -q origin HEAD
