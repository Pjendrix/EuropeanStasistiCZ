# Srozumitelné shrnutí otázek kvízu, obě varianty: Čeští poslanci a Evropské frakce (Claude Haiku, scripts/quiz_summaries.py).
# Běží po každé týdenní aktualizaci (otázky se mohou změnit s novými hlasováními) a ručně.
# Volá API jen pro nové nebo změněné otázky; ostatní shrnutí jsou uložená v data/quiz_summaries.json.
# Klíč ANTHROPIC_API_KEY je jen v GitHub Secrets; bez něj skript nic nevolá a zůstanou uložená shrnutí.
# Bez klíče jdou shrnutí vytvořit lokálně přes Claude Code: python scripts/quiz_summaries.py --backend claude-cli
name: Shrnutí kvízu

on:
  workflow_run:
    workflows: ["Týdenní aktualizace dat"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write    # issue při selhání a upozornění na chybějící shrnutí

concurrency:
  group: weekly-data  # commity do main se nepřekrývají s ostatními datovými běhy
  cancel-in-progress: false

jobs:
  summaries:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install --require-hashes -r requirements.txt

      - name: Shrnutí otázek (Claude Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/quiz_summaries.py --backend api

      - name: Commit
        run: |
          scripts/commit_data.sh "data: shrnutí kvízu $(date -u +%Y-%m-%d)" data/quiz_summaries.json

      - name: Chybějící shrnutí
        id: check
        run: |
          python scripts/quiz_summaries.py --check >> "$GITHUB_OUTPUT"
          python scripts/vote_summaries.py --check >> "$GITHUB_OUTPUT"

      - name: Upozornění na chybějící shrnutí (issue)
        # Bez API klíče se shrnutí nové otázky nevytvoří samo: issue připomene, že je potřeba je obnovit přes Claude Code.
        # Když shrnutí chybí, issue se založí (nebo doplní komentářem); když jsou všechna, otevřené issue se zavře.
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MISSING: ${{ steps.check.outputs.missing }}
          LIST: ${{ steps.check.outputs.list }}
          MISSING_VOTES: ${{ steps.check.outputs.missing_votes }}
          LIST_VOTES: ${{ steps.check.outputs.list_votes }}
        with:
          script: |
            const title = "Chybí AI shrnutí (kvíz nebo úvodní stránka)";
            const old = "Kvíz Moje shoda: chybí shrnutí otázek";  // dřívější název stejného issue
            const n = Number(process.env.MISSING || 0), nv = Number(process.env.MISSING_VOTES || 0);
            const open = await github.paginate(github.rest.issues.listForRepo, { ...context.repo, state: "open", creator: "github-actions[bot]" });
            const hit = open.find((i) => (i.title === title || i.title === old) && !i.pull_request);
            if (n > 0 || nv > 0) {
              const parts = [];
              if (n > 0) parts.push(`**Kvíz Moje shoda:** ${n} otázek nemá srozumitelné shrnutí (zobrazuje se úřední název):\n\n${process.env.LIST}`);
              if (nv > 0) parts.push(`**Úvodní stránka:** ${nv} posledních hlasování nemá krátké shrnutí (karta ukazuje jen nadpis):\n\n${process.env.LIST_VOTES}`);
              const body = parts.join("\n\n") + "\n\n" +
                "Co udělat: v konzoli Claude Code napiš „obnov AI shrnutí“ (spustí `quiz_summaries.py` a `vote_summaries.py` s `--backend claude-cli`, " +
                "zkontroluje výsledek a založí PR). Po mergi se toto issue při dalším běhu samo zavře.";
              if (hit) await github.rest.issues.createComment({ ...context.repo, issue_number: hit.number, body });
              else await github.rest.issues.create({ ...context.repo, title, body });
            } else if (hit) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: hit.number, body: "Všechny otázky kvízu i hlasování na úvodu mají shrnutí, zavírám." });
              await github.rest.issues.update({ ...context.repo, issue_number: hit.number, state: "closed", state_reason: "completed" });
            }

      - name: Issue při selhání
        if: failure()
        uses: ./.github/actions/failure-issue
