# Týdenní aktualizace dat: stáhne poslance (EP API), hlasování (HowTheyVote),
# spočítá statistiky, stáhne portréty a commitne změny do main. Vercel pak web
# nasadí sám. Při změně formátu dat skripty skončí chybou, data se necommitnou a založí se issue.
# Spouští ji i denní kontrola nového exportu HowTheyVote (proposals.yml); pondělí je pojistka.
# Před commitem projde kontrola webu v prohlížeči (Playwright + axe): push přes GITHUB_TOKEN web-check nespustí.
name: Týdenní aktualizace dat

on:
  schedule:
    # pondělí 4:23 UTC (6:23 v létě v Praze); HowTheyVote vydává export o víkendu
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # issue při selhání

concurrency:
  group: weekly-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install -r requirements.txt

      - name: Testy
        run: python -m pytest -q

      - name: Záloha předchozího stavu
        run: cp -r data "$RUNNER_TEMP/data-prev"

      - name: Poslanci (EP Open Data API)
        run: python scripts/fetch_meps.py

      - name: Hlasování (HowTheyVote export)
        run: python scripts/fetch_votes.py

      - name: Projevy v plénu a prezenční listiny (EP Open Data API)
        run: |
          python scripts/fetch_speeches.py
          python scripts/fetch_attendance.py

      - name: Weby politických skupin (Wikidata)
        # Weby se mění zřídka a API občas omezuje dotazy: při chybě zůstane předchozí soubor.
        continue-on-error: true
        run: python scripts/fetch_group_web.py

      - name: Statistiky
        run: python scripts/compute_stats.py

      - name: Soubory pro web
        run: |
          python scripts/build_web.py
          python scripts/build_pages.py

      - name: Portréty
        run: python scripts/fetch_photos.py

      - name: Kontrola rozumnosti dat
        run: python scripts/check_data.py --prev "$RUNNER_TEMP/data-prev"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Kontrola webu (Playwright + axe); při chybě se data necommitnou
        run: |
          python scripts/layout.py --check
          mkdir "$RUNNER_TEMP/e2e" && (cd "$RUNNER_TEMP/e2e" && npm init -y >/dev/null \
            && npm install playwright@1.49.1 axe-core@4.10.2 && npx playwright install --with-deps chromium)
          NODE_PATH="$RUNNER_TEMP/e2e/node_modules" node tests/e2e/check-web.mjs

      - name: Commit nových dat
        # Odloží stažené soubory, srovná se s aktuálním main, přepočítá odvozené a commitne.
        run: |
          day=$(date -u +%Y-%m-%d)
          scripts/commit_data.sh "data: týdenní aktualizace $day" --tag "data-$day" \
            data/meps.json data/votes data/benchmarks.json data/delegations.json data/speeches.json data/attendance.json data/group_web.json public/assets/photos

      - name: Issue při selhání
        if: failure() && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')
        uses: ./.github/actions/failure-issue

  instagram:
    # Balíček pro Instagram (blok F): z dat, která právě přišla do main. Publikace zůstává ruční:
    # ZIP je artifact běhu (90 dní) a issue „Balíček pro Instagram je připravený“ na něj odkazuje i s popisky.
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main   # včetně commitu dat z předchozího jobu

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí a Chromia (jen pro kreslení karet)
        run: |
          pip install -r requirements.txt playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Balíček (jen pro nový export dat)
        id: ig
        run: python scripts/build_instagram.py --only-new >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.ig.outputs.built == 'true'
        with:
          name: instagram-${{ github.run_id }}
          path: out/instagram
          retention-days: 90

      - name: Issue s odkazem ke stažení
        if: steps.ig.outputs.built == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs"), path = require("path");
            const root = "out/instagram", day = fs.readdirSync(root).sort().pop();
            const read = (p) => fs.existsSync(path.join(root, day, p)) ? fs.readFileSync(path.join(root, day, p), "utf8").trim() : null;
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const block = (title, dir) => read(`${dir}/popisek.txt`) ? `### ${title}\n\n**Popisek**\n\n\`\`\`\n${read(`${dir}/popisek.txt`)}\n\`\`\`\n\n` +
              `**Alt texty**\n\n\`\`\`\n${read(`${dir}/alt.txt`)}\n\`\`\`\n` : "";
            const body = `Balíček z dat k ${day}. **Stáhnout ZIP:** ${run} (sekce Artifacts, dole na stránce běhu; platí 90 dní).\n\n` +
              `Postup: rozbalit, v telefonu nahrát obrázky ze složky (karusel = slide-1, slide-2, …; story.png zvlášť), vložit popisek a alt texty. ` +
              `Čísla jsou z dat, nic neupravuj ručně.\n\n` + block("Hlasování ze zasedání", "hlasovani") + "\n" + block("Poslanec v kostce", "poslanec");
            await github.rest.issues.create({ ...context.repo, title: `Balíček pro Instagram je připravený (${day})`, body });

      - name: Uložení rotace poslanců
        if: steps.ig.outputs.built == 'true'
        run: |
          scripts/commit_data.sh "data: rotace balíčku pro Instagram $(date -u +%Y-%m-%d)" data/instagram_state.json

      - name: Issue při selhání
        if: failure() && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')
        uses: ./.github/actions/failure-issue
