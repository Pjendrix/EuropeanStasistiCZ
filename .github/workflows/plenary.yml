# Předběžné výsledky po zasedání (zadání 24. 10. 2026, část C): ve dnech zasedání stáhne jmenovitá hlasování
# z EP Open Data API (meetings/{id}/decisions) do data/preliminary/{datum}.json a commitne je; Vercel web nasadí sám.
# Běží 4× denně (cron v UTC: v zimě 7:07, 13:07, 19:07, 22:37, v létě o hodinu později pražského času), ale jen
# ve dnech zasedání a den po posledním dni (fetch_preliminary.py --due). Dřív byly crony zdvojené kvůli letnímu času
# a polovina běhů jen skončila – každý ale stál nejméně 1 účtovanou minutu, proto jen jedna varianta.
# Pražskou hodinu nekontrolujeme: GitHub naplánované běhy často spouští o hodiny později a kontrola hodiny
# je pak všechny přeskočila (zasedání 11.–12. a 23.–26. 11. 2026 bez předběžných dat). O běhu rozhoduje jen --due.
# Dny, které už má HowTheyVote, se smažou (i v týdenní aktualizaci). Do statistik nic nevstupuje.
name: Předběžné výsledky zasedání

on:
  schedule:
    - cron: "7 6,12,18 * * *"
    - cron: "37 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write   # issue při selhání

# Vlastní skupina, ne weekly-data: nový čekající běh ve skupině ruší starší čekající, takže by předběžné výsledky mohly
# zrušit čekající týdenní aktualizaci (a čekaly by hodiny na proposals.yml). Souběžné commity řeší commit_data.sh
# (srovná se s main a opakuje push).
concurrency:
  group: plenary-data
  cancel-in-progress: false

jobs:
  preliminary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalace závislostí
        run: pip install --require-hashes -r requirements.txt

      - name: Den zasedání?
        id: due
        run: python scripts/fetch_preliminary.py --due >> "$GITHUB_OUTPUT"

      - name: Jmenovitá hlasování (EP Open Data API)
        if: steps.due.outputs.due == 'true'
        run: python scripts/fetch_preliminary.py

      - name: Kontrola dat
        if: steps.due.outputs.due == 'true'
        run: python -m pytest -q tests/test_preliminary.py

      - name: Commit předběžných dat
        if: steps.due.outputs.due == 'true'
        run: |
          scripts/commit_data.sh "data: předběžné výsledky zasedání $(TZ=Europe/Prague date +%Y-%m-%d\ %H:%M)" data/preliminary

      - name: Issue při selhání
        if: failure() && (github.event_name == 'schedule' || github.triggering_actor == 'github-actions[bot]')
        uses: ./.github/actions/failure-issue
